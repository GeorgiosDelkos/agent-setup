# Copy to .github/workflows/mutants.yml. Mutation testing of the code a PR changes: cargo-mutants
# breaks each changed function in small ways (returns a default, flips a comparison) and fails
# when the tests still pass, which means the tests do not check that code (TST-19). From the
# cargo-mutants guide, https://mutants.rs/pr-diff.html (`--in-diff`), with house pinning.
# Runs only on a PR labelled `mutants`: the author's local run is the evidence (TST-19), and
# every mutant reruns the suite, which on GitHub's runners costs hours where a laptop takes
# minutes. Never a required check: most PRs skip it.
permissions:
  contents: read
on:
  pull_request:
    # `labeled`: adding the label starts a run on a PR that is not a draft; a draft's run
    # starts when it is marked ready. While the label stays, each push cancels and restarts
    # the run: remove it to keep a run going.
    types: [opened, synchronize, reopened, ready_for_review, labeled]
name: mutants
jobs:
  mutants:
    # Adding another label also sends `labeled`; only the `mutants` label itself starts a run
    # then. The quoted name in the JSON list is an exact match: `contains` on a lone label's
    # name would match `no-mutants` too.
    if: >-
      ${{ !github.event.pull_request.draft
      && contains(toJSON(github.event.pull_request.labels.*.name), '"mutants"')
      && (github.event.action != 'labeled' || github.event.label.name == 'mutants') }}
    # On the job, not the workflow: a skipped run (another label, a draft) takes no slot, so it
    # cannot cancel a run in progress. `github.ref` is `refs/pull/<number>/merge`: one per PR,
    # where the head branch's name can be the same in two forks. Add the matrix entry to the
    # group if you shard the job, or the shards cancel each other.
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    name: cargo mutants (PR diff)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag=v7.0.1
        with:
          # The whole history, so the diff against the base branch can be taken.
          fetch-depth: 0
          persist-credentials: false
      - name: Diff against the base branch
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git diff "origin/$BASE_REF.." | tee git.diff
      - name: Install stable
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # branch=master
        with:
          toolchain: stable
      - name: cargo install cargo-mutants
        uses: taiki-e/install-action@065d6a08a14e61e89fb0a4c10eecdbdef39c7d8e # tag=v2.85.4
        with:
          tool: cargo-mutants
      - name: cargo mutants
        run: cargo mutants --no-shuffle -vV --in-diff git.diff --cargo-arg=--locked
      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # tag=v7.0.2
        with:
          name: mutants.out
          path: mutants.out
