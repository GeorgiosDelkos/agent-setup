# Copy to .github/workflows/crap.yml, with templates/.cargo-crap.toml at the repo root. CRAP
# scores of the code a PR changes (TST-21): it scores the base commit and the PR in one job and
# fails when a function's score rose, or when a function the PR adds scores above the threshold
# in .cargo-crap.toml. Each failure is an annotation at the function; the full table is in the
# job summary. Costs two coverage runs of the test suite per PR: delete it where the suite
# takes more than a few minutes. Not required on day one: start it as advisory, make it
# required once a few PRs show coverage is stable between runs (threads or timeouts can move
# an unchanged function's score, and any rise above 0.01 fails). Duplicate candidates the PR
# adds or grows are warnings only.
#
# Not minikin/cargo-crap's own Action: it pins its inner actions by tag only, and it needs
# `pull-requests: write` for its PR comment, in the job that runs the PR's code.
# The PR's .cargo-crap.toml scores both sides, so a PR that edits it (epsilon, missing,
# exclude) can loosen this gate: review changes to that file like changes to this one.
permissions:
  contents: read
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
name: crap
jobs:
  crap:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    name: cargo crap (PR against base)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag=v7.0.1
        with:
          # The merge commit and its parents: HEAD^1 is the base the merge was built on.
          fetch-depth: 2
          submodules: true
          persist-credentials: false
      - name: Install stable
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # branch=master
        with:
          toolchain: stable
          components: llvm-tools-preview
      # Newer than the other templates' v2.85.4, which knows cargo-crap only up to 0.3.1.
      - name: cargo install cargo-llvm-cov, cargo-crap
        uses: taiki-e/install-action@645d1ab48b3cb8591684a8b730b2ccf4cb3f9568 # tag=v2.87.33
        with:
          tool: cargo-llvm-cov,cargo-crap@0.9.0
      # Coverage runs the packages and features test.yml's coverage job runs. cargo crap
      # --workspace also parses members those runs skip; their files have no coverage record,
      # score the same on both sides, and the gate below leaves them out.
      - name: Score the base commit
        run: |
          # The PR's config scores both sides, so a PR that changes it is compared under one
          # set of rules (a different try-weight would make every score move).
          head="$(git rev-parse HEAD)"
          cp .cargo-crap.toml "$RUNNER_TEMP/cargo-crap.toml"
          git checkout --quiet HEAD^1
          cp "$RUNNER_TEMP/cargo-crap.toml" .cargo-crap.toml
          # A failing base test lowers base coverage, which can only make the PR look better:
          # without the flag, a red main would fail every PR, including the one that fixes it.
          cargo llvm-cov --locked --all-features --ignore-run-fail --lcov \
            --output-path "$RUNNER_TEMP/base.info"
          cargo crap --workspace --lcov "$RUNNER_TEMP/base.info" \
            --format json --output "$RUNNER_TEMP/base.json"
          git checkout --quiet --force "$head"
      - name: Score the PR
        run: |
          cargo llvm-cov --locked --all-features --lcov --output-path "$RUNNER_TEMP/head.info"
          cargo crap --workspace --lcov "$RUNNER_TEMP/head.info" \
            --baseline "$RUNNER_TEMP/base.json" --format markdown --output "$RUNNER_TEMP/crap.md"
          cargo crap --workspace --lcov "$RUNNER_TEMP/head.info" \
            --baseline "$RUNNER_TEMP/base.json" --format json --output "$RUNNER_TEMP/delta.json"
          cat "$RUNNER_TEMP/crap.md" >>"$GITHUB_STEP_SUMMARY"
      - name: Gate
        run: |
          threshold="$(sed -n 's/^threshold *= *//p' .cargo-crap.toml)"
          if [[ -z "$threshold" ]]; then
            echo "::error file=.cargo-crap.toml::no threshold key; copy templates/.cargo-crap.toml"
            exit 1
          fi
          # Not --fail-regression: it ignores new functions, and its exit code names no function.
          # A null coverage is a file the coverage run did not compile (another target's cfg, a
          # member test.yml skips), which no test in this job can cover.
          failures="$(jq -r --argjson t "$threshold" '.entries[]
            | select(.coverage != null)
            | select(.status == "regressed" or (.status == "new" and .crap > $t))
            | "::error file=\(.file | ltrimstr("./")),line=\(.line)::\(.function): "
              + (if .status == "new" then "new function scores CRAP \(.crap), above \($t)"
                 else "CRAP rose from \(.baseline_crap) to \(.crap)" end)
              + " (CC \(.cyclomatic), \(.coverage)% covered): test its uncovered lines or split it"
            ' "$RUNNER_TEMP/delta.json")"
          # Duplicate groups the PR adds or grows are warnings: the author merges them or says
          # in the PR why they stay apart. `// []`: absent when [duplicates] is off. The status
          # is per group, not per member, so the annotation sits on the first member, which in
          # a grown group may be an unchanged function; the message names every member.
          jq -r '(.duplicate_groups // [])[]
            | select(.status == "new" or .status == "grown")
            | .members[0] as $m
            | "::warning file=\($m.file | ltrimstr("./")),line=\($m.start_line)::"
              + "\(.status) duplicate candidate (similarity \(.score * 100 | round)%): "
              + ([.members[] | "\(.function) at \(.file | ltrimstr("./")):\(.start_line)"]
                 | join(", "))
            ' "$RUNNER_TEMP/delta.json"
          if [[ -n "$failures" ]]; then
            echo "$failures"
            {
              echo
              echo "**Gate failed:** a score rose, or a new function is above $threshold."
              echo "Renamed functions count as new. See this job's annotations."
            } >>"$GITHUB_STEP_SUMMARY"
            exit 1
          fi
