# Copy to .github/workflows/nostd.yml. From jonhoo/rust-ci-conf @ de512da1e85b.
# This workflow checks whether the library is able to run without the std library (e.g., embedded).
# It applies only to no_std-capable crates: delete this entire file if the crate does not support
# no_std. See check.yml for information about how the concurrency cancellation and workflow
# triggering works
permissions:
  contents: read
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
name: no-std
jobs:
  nostd:
    runs-on: ubuntu-latest
    name: ${{ matrix.target }}
    strategy:
      matrix:
        target: [thumbv7m-none-eabi, aarch64-unknown-none]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag=v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - name: Install stable
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # branch=master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: cargo check
        run: cargo check --locked --target "$TARGET" --no-default-features
        env:
          TARGET: ${{ matrix.target }}
