# .cargo-crap.toml: copy to the repo root (REPO-1). cargo-crap scores each function by
# CRAP = CC^2 * (1 - coverage)^3 + CC (TST-21); this file is read by local runs and by
# templates/ci/crap.yml. Keys (v0.9.0):
# https://github.com/minikin/cargo-crap/blob/49f67037505997092f3df41d7a88e4fbfa09daee/docs/reference/config.md

# Savoia and Evans' cut-off, also the tool's default and Uncle Bob's: above it a function is
# complex and under-tested. CRAP is never below CC, so a function with CC above 30 can only
# pass by being split. crap.yml's gate reads this line, so keep it as `threshold = <number>`.
threshold = 30.0

# `?` adds nothing to CC. Line coverage marks a `?` line covered whether or not its error path
# ran, so counting `?` raises a function's score with no test that could lower it again;
# error paths are held by TST-1 (a test per error variant) and TST-19 (mutants) instead.
# Measured 2026-11-05: on untested CLI glue, weight 1.0 flagged 26 of 139 functions and 0.0
# flagged 13; on well-tested crates (249 functions) the weight changed nothing. A baseline
# recorded under another weight compares different numbers: regenerate it after a change.
try-weight = 0.0

# Each flagged function lists its uncovered line ranges, which says where the tests go.
uncovered-hints = true

# Test modules kept in their own file (`#[cfg(test)] mod tests;`, which is tests.rs or
# tests/mod.rs) are scored like product code: cargo-crap skips only an inline
# `#[cfg(test)] mod` and `#[test]` functions. Add the repo's own test file names here. A
# crate's top-level tests/, benches/ and examples/ are excluded by default. Excluded files
# still in the LCOV report make each run print a "source/LCOV scope mismatch" warning; with
# these excludes that warning is expected.
exclude = ["**/tests.rs", "**/*_tests.rs", "**/tests/**"]
