# Only github-actions: this repo has no package manifests. The 7-day cooldown is the house rule
# (gh-actions-style): a release ages a week before a PR, so a compromised one can be yanked first.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      gha-bump:
        applies-to: version-updates
        update-types:
          - "patch"
          - "minor"
